<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adhere Adapter Screen 示例</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
        }

        #app {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 3rem;
            margin: 0 0 1rem 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.2rem;
            margin: 0;
            opacity: 0.9;
        }

        .controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            background: rgba(255,255,255,0.2);
            color: white;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .btn:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }

        .btn.active {
            background: rgba(255,255,255,0.4);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .info-panel {
            background: rgba(255,255,255,0.1);
            padding: 1.5rem;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            max-width: 600px;
            text-align: center;
        }

        .info-panel h3 {
            margin: 0 0 1rem 0;
            font-size: 1.5rem;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .info-item {
            background: rgba(255,255,255,0.1);
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
        }

        .info-item strong {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
        }

        .fixed-element {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.2);
            padding: 1rem;
            border-radius: 8px;
            backdrop-filter: blur(10px);
            z-index: 1000;
        }

        .special-element {
            background: rgba(255,255,255,0.2);
            padding: 1rem;
            border-radius: 8px;
            margin: 1rem 0;
            backdrop-filter: blur(10px);
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }
            
            .controls {
                flex-direction: column;
                align-items: center;
            }
            
            .btn {
                width: 200px;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="header">
            <h1>🎯 Adapter Screen</h1>
            <p>强大的屏幕适配工具演示</p>
        </div>

        <div class="controls">
            <button class="btn" onclick="initBasic()">基础适配</button>
            <button class="btn" onclick="initCustom()">自定义适配</button>
            <button class="btn" onclick="initFlexible()">弹性布局</button>
            <button class="btn" onclick="detectDevice()">检测设备</button>
            <button class="btn" onclick="applyRectification()">元素修正</button>
            <button class="btn" onclick="setMinSize()">设置最小尺寸</button>
            <button class="btn" onclick="detectZoom()">检测缩放</button>
            <button class="btn" onclick="cleanup()">清理</button>
        </div>

        <div class="info-panel">
            <h3>📊 当前状态</h3>
            <div class="info-grid">
                <div class="info-item">
                    <strong>设备类型</strong>
                    <span id="device-type">未检测</span>
                </div>
                <div class="info-item">
                    <strong>屏幕尺寸</strong>
                    <span id="screen-size">未检测</span>
                </div>
                <div class="info-item">
                    <strong>缩放比例</strong>
                    <span id="zoom-ratio">未检测</span>
                </div>
                <div class="info-item">
                    <strong>适配状态</strong>
                    <span id="adapter-status">未初始化</span>
                </div>
            </div>
        </div>

        <div class="special-element">
            <h4>🎨 特殊元素</h4>
            <p>这个元素会应用特殊的缩放修正效果</p>
        </div>
    </div>

    <div class="fixed-element">
        <strong>🔒 固定元素</strong>
        <p>这个元素被忽略缩放</p>
    </div>

    <script type="module">
        import adapterScreen from '../src/index.js';

        // 全局变量
        let isInitialized = false;

        // 更新状态显示
        function updateStatus() {
            const deviceType = adapterScreen.isPhoneSize() ? '手机' : 
                              adapterScreen.isPadSize() ? '平板' : 'PC';
            
            document.getElementById('device-type').textContent = deviceType;
            document.getElementById('screen-size').textContent = 
                `${window.innerWidth} × ${window.innerHeight}`;
            document.getElementById('zoom-ratio').textContent = 
                `${window.devicePixelRatio || 1}`;
            document.getElementById('adapter-status').textContent = 
                isInitialized ? '已初始化' : '未初始化';
        }

        // 基础适配
        window.initBasic = function() {
            adapterScreen.init();
            isInitialized = true;
            updateStatus();
            console.log('基础适配已初始化');
        };

        // 自定义适配
        window.initCustom = function() {
            adapterScreen.init({
                el: '#app',
                dw: 1920,
                dh: 1080,
                resize: true,
                transition: 0.3,
                delay: 100,
                ignore: [
                    {
                        el: '.fixed-element',
                        scale: 1,
                        fontSize: 14,
                        width: 200,
                        height: 100
                    }
                ]
            });
            isInitialized = true;
            updateStatus();
            console.log('自定义适配已初始化');
        };

        // 弹性布局
        window.initFlexible = function() {
            adapterScreen.flexible({
                minWidth: 320,
                minHeight: 568
            }, true);
            isInitialized = true;
            updateStatus();
            console.log('弹性布局已初始化');
        };

        // 检测设备
        window.detectDevice = function() {
            updateStatus();
            console.log('设备检测完成');
        };

        // 元素修正
        window.applyRectification = function() {
            if (isInitialized) {
                adapterScreen.elRectification('.special-element', 1.5);
                console.log('元素修正已应用');
            } else {
                alert('请先初始化适配器');
            }
        };

        // 设置最小尺寸
        window.setMinSize = function() {
            adapterScreen.setPageMinSizeToCSS(document.body);
            console.log('页面最小尺寸已设置');
        };

        // 检测缩放
        window.detectZoom = function() {
            adapterScreen.detectZoom();
            updateStatus();
            console.log('浏览器缩放检测完成');
        };

        // 清理
        window.cleanup = function() {
            adapterScreen.off('#app');
            isInitialized = false;
            updateStatus();
            console.log('适配效果已关闭');
        };

        // 初始化状态显示
        updateStatus();

        // 监听窗口大小变化
        window.addEventListener('resize', updateStatus);

        // 页面加载完成后自动初始化基础适配
        window.addEventListener('load', () => {
            setTimeout(() => {
                initBasic();
            }, 1000);
        });
    </script>
</body>
</html>
